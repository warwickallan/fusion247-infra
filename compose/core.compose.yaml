# AS-BUILT core stack — reflects what is genuinely deployed on fusion247-core (2026-07-22).
# Deployed via Coolify (Redis = managed database; Directus = docker-image app). This file is
# the sanitised, reproducible definition — secrets are ${ENV} refs held in Coolify, never here.

services:
  # Redis — deployed by Coolify as a managed database (image redis:7.2), private network, auth.
  redis:
    image: redis:7.2
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fusion247]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Directus 11.17.4 (STAGING) — reads the live ops Supabase via the pooler.
  # As-built: cache & rate-limiter OFF (Redis not yet wired to Directus); no depends_on.
  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: ${DB_HOST}                 # aws-0-eu-west-1.pooler.supabase.com
      DB_PORT: ${DB_PORT}                 # 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}                 # cp_directus.kerdinlgcfxnjrztwqde (ops)
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SEARCH_PATH: ${DB_SEARCH_PATH}   # directus_sys,asdair,cockpit
      # ⚠️ STAGING ONLY — PRODUCTION CUTOVER BLOCKER: use a proper CA / verify TLS in prod.
      DB_SSL__REJECT_UNAUTHORIZED: "false"
      CACHE_ENABLED: "false"              # as-built; wire to Redis at production cutover
      RATE_LIMITER_ENABLED: "false"
      NO_UPDATE_NOTIFIER: "1"
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}  # http://100.101.240.85:8055 (tailnet)
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8055/server/health"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 40s
    networks: [fusion247]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    # Port published on the host tailnet as 8055:8055 (Hetzner firewall keeps it private).

networks:
  fusion247:
    driver: bridge
